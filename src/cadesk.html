<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CA Desk – Practice Management for CAs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--panel:#fff;--ink:#141c33;--mut:#5f6b85;--faint:#8a94ab;--line:#e2e6ef;--line2:#eef1f6;--pri:#2b47c9;--pri-d:#1f36a3;--pri2:#ebefff;--ok:#0f7a4a;--okb:#e2f4ea;--warn:#9a5800;--warnb:#fff2db;--bad:#b3242d;--badb:#fde7e9;--info:#245b9e;--infob:#e5effb;--side:#0f1730;--side2:#18223f;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
#app{display:grid;grid-template-columns:248px 1fr;height:100vh}
/* sidebar */
#side{background:var(--side);color:#c9d1e6;display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5b78ff,#2b47c9);display:grid;place-items:center;font-weight:700;font-size:14px}
.brand b{font-size:15px;display:block}.brand small{font-size:11px;color:#8f9ac0}
.persona{margin:0 14px 10px;background:var(--side2);border-radius:9px;padding:10px 12px}
.persona label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#8f9ac0}
.persona select{width:100%;margin-top:4px;background:transparent;border:0;color:#fff;font-weight:600;outline:0;cursor:pointer}
.persona select option{color:#000}
.navsec{padding:10px 18px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#7d88ad}
.nav{display:flex;align-items:center;gap:10px;padding:7px 14px;margin:1px 8px;border-radius:8px;cursor:pointer;color:#c9d1e6;text-decoration:none}
.nav:hover{background:#1b2648}
.nav.on{background:#26346a;color:#fff}
.nav .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;background:#212d55;color:#aeb9e0;flex:none}
.nav.on .ic{background:#4d68f0;color:#fff}
.nav .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .bdg{font-size:10.5px;background:#b3242d;color:#fff;border-radius:10px;padding:1px 7px}
.tier{font-size:9.5px;color:#7d88ad;border:1px solid #2e3a63;border-radius:4px;padding:0 4px}
.sidefoot{margin-top:auto;padding:14px 18px;font-size:11px;color:#7d88ad;border-top:1px solid #1d2747}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2fc77a;margin-right:6px}
/* main */
#mainwrap{display:flex;flex-direction:column;overflow:hidden}
#top{height:56px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--faint);cursor:pointer}
.search kbd{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#fff}
.topr{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--mut);background:#fff}
.avatar{width:30px;height:30px;border-radius:50%;background:#dfe5ff;color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:12px}
#main{flex:1;overflow:auto;padding:22px 26px 60px}
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.ph p{margin:0;color:var(--mut);max-width:760px;line-height:1.5}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:11.5px;color:var(--faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 10px;font-size:14px}
.card h3 small{font-weight:400;color:var(--mut);margin-left:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.mb{margin-bottom:14px}.mt{margin-top:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#b9c4ef}
.kpi .l{font-size:11.5px;color:var(--mut)}
.kpi .v{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#b9c4ef;background:#fafbff}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--pri)}.btn.ghost:hover{background:var(--pri2)}
.btn.okb{background:var(--okb);border-color:#bfe5cf;color:var(--ok)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border-radius:5px;padding:2px 7px;font-weight:500;white-space:nowrap;background:var(--line2);color:var(--mut)}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.info{background:var(--infob);color:var(--info)}.chip.pri{background:var(--pri2);color:var(--pri)}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
.t th{text-align:left;font-weight:600;color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfd;position:sticky;top:0;z-index:1}
.t td{padding:7px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.t tr:hover td{background:#fafbff}
.t .r,.r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.tot td{font-weight:700;background:#f6f8fc;border-top:1px solid var(--line)}
.t tr.sub td{font-weight:600;background:#fbfcfe}
.t tr.hl td{background:#fffaf0}
.tw{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:#fff;max-height:560px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.on{color:var(--pri);border-color:var(--pri)}
.tab .chip{margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.seg span{padding:5px 11px;cursor:pointer;color:var(--mut);font-size:12.5px;border-right:1px solid var(--line)}
.seg span:last-child{border-right:0}
.seg span.on{background:var(--pri2);color:var(--pri);font-weight:600}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff;outline:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:#8ea0ea;box-shadow:0 0 0 3px #e3e8ff}
select.in.sm{padding:3px 6px;font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--mut)}.faint{color:var(--faint)}.b{font-weight:600}
.small{font-size:12px}
.note{background:var(--infob);color:#21426e;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.5}
.note.warn{background:var(--warnb);color:#6d4300}
.note.ok{background:var(--okb);color:#0b5a37}
.drop{border:1.5px dashed #b9c4ef;border-radius:var(--r);padding:22px;text-align:center;background:#fafbff;color:var(--mut)}
.drop b{color:var(--ink)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.flowcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.flowcol h4{margin:0 0 2px;font-size:13.5px}.flowcol p{margin:0 0 10px;color:var(--mut);font-size:12px}
.flowcol .n{position:absolute;right:14px;top:12px;font-size:28px;font-weight:700;color:#e9ecf6}
.mini{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer}
.mini:hover{background:var(--pri2)}
.mini .ic{width:22px;height:22px;border-radius:6px;background:var(--pri2);color:var(--pri);font-size:9.5px;font-weight:700;display:grid;place-items:center}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:0}
.prog{height:7px;background:var(--line2);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:5px;transition:width .3s}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#eef1f7;border-radius:var(--r);padding:10px;min-height:200px}
.col h5{margin:2px 4px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:flex;justify-content:space-between}
.tk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:#b9c4ef}
.tk .f{font-weight:600}.tk .c{color:var(--mut);font-size:12px;margin:2px 0 6px}
.inv{background:#fdfdfb;border:1px solid #ddd;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px;font-family:Georgia,serif;font-size:12px;color:#333;transform:rotate(-.6deg);position:relative;overflow:hidden}
.inv h4{margin:0;font-size:16px;letter-spacing:.02em}
.inv table{width:100%;border-collapse:collapse;margin-top:8px}.inv td,.inv th{border:1px solid #ccc;padding:4px 6px;font-size:11px}
.scanline{position:absolute;left:0;right:0;height:40px;background:linear-gradient(transparent,rgba(43,71,201,.25),transparent);animation:scan 1s linear infinite}
@keyframes scan{from{top:-40px}to{top:100%}}
.field{display:grid;grid-template-columns:130px 1fr 70px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2)}
.conf{font-size:11px;text-align:right}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.check .ico{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;font-weight:700}
.ico.ok{background:var(--okb);color:var(--ok)}.ico.bad{background:var(--badb);color:var(--bad)}.ico.warn{background:var(--warnb);color:var(--warn)}
pre.code{background:#0f1730;color:#cfe0ff;border-radius:8px;padding:12px;max-height:340px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:11.5px;white-space:pre;margin:0}
pre.txt{background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;font-family:inherit;font-size:12.8px;line-height:1.55;max-height:380px;overflow:auto;margin:0}
/* modal */
#ov{position:fixed;inset:0;background:rgba(15,23,48,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
#ov.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh b{font-size:15px}.modal .mh .x{margin-left:auto;cursor:pointer;color:var(--faint);font-size:20px;line-height:1}
.modal .mb2{padding:16px 18px;max-height:65vh;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60}
.tst{background:#141c33;color:#fff;padding:10px 16px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:13px;animation:up .2s}
@keyframes up{from{transform:translateY(10px);opacity:0}}
#pal{position:fixed;inset:0;background:rgba(15,23,48,.4);display:none;justify-content:center;padding-top:12vh;z-index:70}
#pal.on{display:flex}
.palbox{background:#fff;border-radius:12px;width:min(560px,92vw);height:fit-content;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;outline:0}
.palit{padding:9px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
.palit.on,.palit:hover{background:var(--pri2)}
.lbl{font-size:11.5px;color:var(--mut);display:block;margin-bottom:3px}
.formg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.formg .full{grid-column:1/-1}
.formg .in{width:100%}
.tree{font-size:12.8px}.tree div{padding:3px 0}
.right{margin-left:auto}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2)}
.bar i{display:block;height:100%}
.empty{padding:30px;text-align:center;color:var(--faint)}
@media (max-width:1100px){.g4,.g5,.g6{grid-template-columns:repeat(2,1fr)}.split,.flow,.board{grid-template-columns:1fr}.g3{grid-template-columns:1fr}}
@media (max-width:760px){#app{grid-template-columns:1fr}#side{display:none}.g2{grid-template-columns:1fr}}

/* ---- User switcher bar ---- */
#userswitcher{position:fixed;bottom:16px;right:16px;z-index:9999}
#userswitcher button{display:flex;align-items:center;gap:8px;background:#1a2c5b;color:#fff;border:none;border-radius:24px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:.15s}
#userswitcher button:hover{background:#2544aa;transform:translateY(-1px)}
#userswitcher button .uic{width:26px;height:26px;border-radius:50%;background:#22c55e;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="mainwrap">
    <header id="top">
      <div class="search" data-act="pal">⌕ <span>Jump to a module, client or task…</span><kbd>Ctrl K</kbd></div>
      <div class="topr">
        <span class="pill"><span class="dot"></span>Tally Prime · localhost:9000</span>
        <span class="pill">Offline · Encrypted local DB</span>
        <span class="pill" data-act="notif" style="cursor:pointer;position:relative" title="Notifications">🔔 Notifications <b id="ncount" style="background:#b3242d;color:#fff;border-radius:9px;padding:0 6px;font-size:11px"></b></span>
        <select class="in sm" id="gclient" data-chg="gclient" title="Client filter"></select>
        <div class="avatar" title="CA Meera Iyer">MI</div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="ov"><div class="modal"><div class="mh"><b id="mt"></b><span class="x" data-act="closeModal">×</span></div><div class="mb2" id="mbody"></div><div class="mf" id="mfoot"></div></div></div>
<div id="pal"><div class="palbox"><input id="palin" placeholder="Type a module, client or filing…" autocomplete="off"><div id="pallist"></div></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   CA Desk — interactive prototype. All data is sample data held in memory.
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=(n,dp=0)=>{if(n===null||n===undefined||isNaN(n))return'—';const v=Math.abs(n);return(n<0?'-':'')+'₹'+v.toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp})};
const num=n=>Math.round(n).toLocaleString('en-IN');
const D=s=>new Date(s+'T00:00:00');
const fd=s=>s?D(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fds=s=>s?D(s).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'—';
const TODAY='2026-11-10';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};

const days=(a,b)=>Math.round((D(b)-D(a))/864e5);
const pct=(a,b)=>b?(a/b*100):0;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const store={get(k){try{return localStorage.getItem('cadesk_'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('cadesk_'+k,v)}catch(e){}}};
// GSTIN checksum (official mod-36 algorithm)
const CP='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function gstCheck(g){let f=2,sum=0;for(let i=13;i>=0;i--){const c=CP.indexOf(g[i])*f;f=f===2?1:2;sum+=Math.floor(c/36)+c%36}return CP[(36-sum%36)%36]}
const G=b=>b+gstCheck(b);
const badG=b=>{const c=gstCheck(b);return b+(c==='A'?'B':'A')};
const gstValid=g=>/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g)&&gstCheck(g.slice(0,14))===g[14];
const STATES={'27':'Maharashtra','24':'Gujarat','29':'Karnataka','07':'Delhi','33':'Tamil Nadu'};

/* ---------------- Personas & modules ---------------- */
const PERSONAS={
 owner:{name:'Practising CA / Firm owner',short:'Firm owner',mods:['collect','comp','notice','multi','gst','bank','tb','audit','vault','cg']},
 article:{name:'Article student / Accountant',short:'Article / Accountant',mods:['collect','bank','ocr','gst','comp','vault','tds','scr']},
 auditor:{name:'Statutory / Internal auditor',short:'Auditor',mods:['tb','collect','scr','audit','fa','msme','tds','multi']},
 corp:{name:'CA in corporate / Big4',short:'Corporate / Big4',mods:['gst','collect','tds','tb','scr','msme','fa','multi']},
 tax:{name:'Tax consultant (individual & corporate)',short:'Tax consultant',mods:['collect','cg','tds','notice','comp','vault','gst']},
 all:{name:'Show everything',short:'All modules',mods:['collect','bank','gst','ocr','comp','tb','scr','audit','tds','cg','notice','msme','fa','vault','multi']}
};
const MODS={
 home:{label:'Home',ic:'⌂'},
 collect:{label:'Client data collection',ic:'DC',tier:1,stage:1,desc:'Right data, right order, reminders, cleansing'},
 portal:{label:'Client portal (client view)',ic:'CP'},
 bank:{label:'Bank → Tally',ic:'BK',tier:1,stage:1,desc:'Parse any bank statement, auto-map ledgers, push vouchers'},
 ocr:{label:'Invoice capture',ic:'OC',tier:1,stage:1,desc:'Bills & photos to purchase vouchers'},
 gst:{label:'GST reconciliation',ic:'GS',tier:1,stage:2,desc:'GSTR-2B vs books, GSTR-1 vs 3B, vendor follow-up'},
 comp:{label:'Compliance & clients',ic:'CC',tier:1,stage:3,desc:'Due dates, status board, staff, document requests'},
 tb:{label:'TB → Schedule III',ic:'TB',tier:2,stage:3,desc:'Mapping memory, financial statements, ratios'},
 scr:{label:'Ledger scrutiny',ic:'LS',tier:2,stage:2,desc:'Red-flag rules over every voucher'},
 audit:{label:'Audit toolkit',ic:'AU',tier:2,stage:3,desc:'Sampling, CARO 2020, tax audit pack, confirmations'},
 tds:{label:'TDS & 26AS / AIS',ic:'TD',tier:2,stage:2,desc:'Credits vs books, missed TDS, section mapping'},

 r.files.push(...names);r.checks=checks;r.st='Received';r.issues=[];r.recv=TODAY;notify('client',`${CONTACT[r.c]} uploaded ${names.length} file(s) for “${it.t}”`);toast('Uploaded ✓ — your CA has been notified');render()};
ACT.pNA=d=>{const r=S.col.req.find(x=>x.id==d.id);r.st='N/A';notify('client',`${CONTACT[r.c]} marked “${TEMPL[r.tk].items[r.ii].t}” as not applicable this month`);toast('Marked as not applicable');render()};
ACT.pForm=d=>{const r=S.col.req.find(x=>x.id==d.id);const ans={};document.querySelectorAll(`[data-f="${d.id}"]`).forEach(el=>{if(el.type==='radio'){if(el.checked)ans[el.name.split('|')[1]]=el.value}else ans[el.dataset.l]=el.value||'—'});r.ans=ans;r.st='Received';r.recv=TODAY;notify('client',`${CONTACT[r.c]} answered “${TEMPL[r.tk].items[r.ii].t}”`);toast('Submitted ✓ Thank you!');render()};
ACT.pApprove=d=>{const r=S.col.req.find(x=>x.id==d.id);r.st='Approved';r.recv=TODAY;notify('client',`${CONTACT[r.c]} approved “${TEMPL[r.tk].items[r.ii].t}”`);toast('Approved ✓ — your CA will file it');render()};
ACT.pAsk=d=>{const r=S.col.req.find(x=>x.id==d.id);modal('Ask your CA a question',`<textarea class="in" id="pq" rows="4" style="width:100%" placeholder="e.g. Invoice 0841 to Zenith was cancelled — please exclude it."></textarea>`,[{t:'Cancel'},{t:'Send',cls:'pri',f:()=>{S.col.q.push({id:Date.now(),c:r.c,from:'Client',ref:TEMPL[r.tk].items[r.ii].t,at:'Today',txt:'Client asks: '+$('#pq').value,ans:'(awaiting CA)'});notify('client',`${CONTACT[r.c]} asked a question on “${TEMPL[r.tk].items[r.ii].t}”`);toast('Sent to your CA');render()}}])};
ACT.pReply=d=>{const q=S.col.q.find(x=>x.id==d.id);const v=document.getElementById('pr'+d.id).value.trim();if(!v){toast('Type a reply first');return}q.ans=v;notify('client',`${CONTACT[q.c]} replied to your query (${q.ref})`);toast('Reply sent ✓');render()};
function pFormHTML(r){const it=TEMPL[r.tk].items[r.ii];let f;
 if(r.tk==='gst')f=[['Cash sales this month (₹)','n'],['Did you import anything?','yn'],['Paid an advocate, transporter (GTA) or other reverse-charge service?','yn'],['Bought any machine / asset above ₹50,000? (amount)','n'],['Opened a new bank account?','yn']];
 else if(r.tk==='adv')f=[['Savings & FD interest so far (₹)','n'],['Rent received so far (₹)','n'],['Any other income? (describe)','t']];
 else if(r.tk==='notice')f=[['Was this interest included in your return?','yn3']];
 else f=[['Details','t']];
 return f.map(([l,k],i)=>{const nm=`f${r.id}_${i}|${l}`;if(k==='yn'||k==='yn3')return`<div class="mb"><div class="small b" style="margin-bottom:4px">${l}</div><div class="row">${(k==='yn'?['No','Yes']:['Yes, included','No','Not sure']).map(o=>`<label class="pill" style="cursor:pointer"><input type="radio" name="${esc(nm)}" value="${o}" data-f="${r.id}" ${o==='No'?'checked':''}> ${o}</label>`).join('')}</div></div>`;
  return`<div class="mb"><div class="small b" style="margin-bottom:4px">${l}</div><input class="in" style="width:100%" ${k==='n'?'type="number" placeholder="0"':''} data-f="${r.id}" data-l="${esc(l)}"></div>`}).join('')+`<button class="btn pri" data-act="pForm" data-id="${r.id}">Submit answers</button>`}
function pApproveHTML(r){const S2={gst:'<b>GSTR-1 for October 2026</b><br>42 B2B invoices · taxable ₹29,34,000 · GST ₹1,46,700<br>3 credit notes · ₹48,000<br>B2C sales ₹1,12,000',adv:'<b>Advance tax estimate</b><br>Estimated income ₹24.6 lakh · tax for the year ₹4,38,500<br>Paid so far ₹1,85,000 · <b>pay by 15 Dec: ₹1,43,900</b>',notice:'<b>Reply to 143(1)(a)</b><br>We will explain that the interest was offered under Other Sources and the AIS entry is duplicated.',audit:'<b>Management representation letter</b> — FY 2026-27'}[r.tk]||'';return`<div class="note mb">${S2}</div><div class="row"><button class="btn pri" data-act="pApprove" data-id="${r.id}">Approve</button><button class="btn" data-act="pAsk" data-id="${r.id}">I have a question</button><span class="small faint">View the full draft (PDF)</span></div>`}
R.portal=()=>{const c=S.portal.c;const cl=CLIENTS.find(x=>x.id===c);const first=CONTACT[c].split(' (')[0].replace(/^Dr\. |^Fr\. /,'').split(' ')[0];
 const L=S.col.req.filter(r=>r.c===c);const need=L.filter(r=>!doneSt(r.st)&&r.st!=='Scheduled'&&r.st!=='Approved').sort((a,b)=>a.due.localeCompare(b.due));const soon=L.filter(r=>r.st==='Scheduled').sort((a,b)=>a.due.localeCompare(b.due));const done=L.filter(r=>doneSt(r.st)||r.st==='Approved');
 const live=L.filter(r=>r.st!=='Scheduled');const p=live.length?Math.round(live.filter(r=>doneSt(r.st)||r.st==='Approved').length/live.length*100):100;
 const qs=S.col.q.filter(q=>q.c===c&&q.from==='CA');
 const card=r=>{const it=TEMPL[r.tk].items[r.ii];const s=eff(r);const dd=days(TODAY,r.due);const late=dd<0;
  const tag=r.st==='Issues'?'<span class="chip warn">Needs a fix</span>':r.st==='Partial'?'<span class="chip warn">Partly received</span>':r.st==='Awaiting approval'?'<span class="chip pri">Your approval needed</span>':late?'<span class="chip bad">Late</span>':'<span class="chip">To do</span>';
  let act='';if(it.kind==='file')act=`<div class="row"><label class="btn pri">⇪ Upload${r.st==='Partial'?' remaining':r.st==='Issues'?' again':''}<input type="file" multiple hidden data-chg="pUp" data-id="${r.id}"></label>${!it.must?`<button class="btn" data-act="pNA" data-id="${r.id}">Nothing this month</button>`:''}<span class="small faint">or send on WhatsApp to +91 98200 11223</span></div>`;
  if(it.kind==='form')act=pFormHTML(r);if(it.kind==='approve')act=pApproveHTML(r);
  return`<div class="card mb" style="border-left:4px solid ${late?'var(--bad)':r.st==='Issues'||r.st==='Partial'?'#d8920f':'var(--pri)'}"><div class="row"><b style="font-size:14.5px">${esc(it.t)}</b>${tag}<span class="right small ${late?'b':''}" style="color:${late?'var(--bad)':'var(--mut)'}">${late?`Was due ${fds(r.due)} · ${-dd} days ago`:dd===0?'Due today':`Due ${fds(r.due)} · in ${dd} days`}</span></div>
  <div class="small muted" style="margin:4px 0 10px">${esc(it.why)} <span class="faint">· ${esc(it.fmt)}</span></div>
  ${r.issues.length?`<div class="note warn mb small">Your CA says: ${r.issues.map(esc).join(' · ')}</div>`:''}${r.files.length&&r.st!=='Requested'?`<div class="small mb">Already sent: ${r.files.map(esc).join(', ')}</div>`:''}${act}</div>`};
 return`<div class="note mb row" style="background:#141c33;color:#dfe6ff"><span><b>Client view.</b> This is what ${esc(CONTACT[c])} sees on phone or web, in ${S.col.rules.lang}. Anything submitted here appears straight away on your collection tracker.</span><span class="right row"><span class="small">Preview as</span><select class="in sm" data-chg="pClient">${[...new Set(S.col.req.map(r=>r.c))].map(x=>`<option value="${x}" ${x===c?'selected':''}>${esc(cName(x))}</option>`).join('')}</select><button class="btn sm" data-act="go" data-id="collect">← Back to CA view</button></span></div>
 <div style="max-width:860px;margin:0 auto">
 <div class="card mb" style="background:linear-gradient(135deg,#2b47c9,#4d68f0);color:#fff;border:0"><div class="row"><div><div class="small" style="opacity:.8">Iyer & Associates · Chartered Accountants</div><div style="font-size:20px;font-weight:700;margin-top:4px">Hello ${esc(first)}</div><div style="opacity:.9;margin-top:2px">${need.length?`We need ${need.length} thing${need.length>1?'s':''} from you for ${esc(cl.name)}.`:'You’re all caught up — thank you!'}</div></div><div class="right" style="text-align:right"><div style="font-size:28px;font-weight:700">${p}%</div><div class="small" style="opacity:.8">complete this month</div></div></div><div class="prog mt" style="background:rgba(255,255,255,.25)"><i style="width:${p}%;background:#fff"></i></div></div>
 ${qs.filter(q=>!q.ans).length?`<h3 style="font-size:14px;margin:16px 0 8px">Questions from your CA</h3>${qs.filter(q=>!q.ans).map(q=>`<div class="card mb" style="border-left:4px solid #d8920f"><div class="small faint">${esc(q.ref)} · ${q.at}</div><div style="white-space:pre-line;margin:6px 0 10px">${esc(q.txt)}</div><div class="row"><input class="in" id="pr${q.id}" style="flex:1" placeholder="Type your reply…"><button class="btn pri" data-act="pReply" data-id="${q.id}">Reply</button></div></div>`).join('')}`:''}
 <h3 style="font-size:14px;margin:16px 0 8px">To do, in order</h3>${need.map(card).join('')||'<div class="card empty">Nothing pending 🎉</div>'}
 ${soon.length?`<h3 style="font-size:14px;margin:16px 0 8px">Coming up</h3><div class="card">${soon.slice(0,6).map(r=>{const it=TEMPL[r.tk].items[r.ii];return`<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line2)"><span class="chip">${fds(r.due)}</span><span>${esc(it.t)}</span><span class="small faint right">${TEMPL[r.tk].short} · we’ll remind you ${S.col.rules.send} days before</span></div>`}).join('')}${soon.length>6?`<div class="small faint mt">+${soon.length-6} more later in the year</div>`:''}</div>`:''}
 <h3 style="font-size:14px;margin:16px 0 8px;cursor:pointer" data-act="pDone">Done (${done.length}) ${S.portal.done?'▾':'▸'}</h3>${S.portal.done?`<div class="card">${done.map(r=>`<div class="row" style="padding:5px 0"><span class="chip ok">✓</span>${esc(TEMPL[r.tk].items[r.ii].t)}<span class="small faint right">${r.recv?fds(r.recv):''}</span></div>`).join('')}</div>`:''}
 <p class="small faint" style="text-align:center;margin-top:20px">Files go only to your CA’s office computer, encrypted end to end. Your CA defined this checklist for your business.</p></div>`};

 <div class="card"><h3>Data packs <small>update without reinstalling</small></h3><table class="t"><tr><th>Pack</th><th>Version</th><th>Covers</th></tr>${[['Due-date calendar','2026.11','GST, TDS, ROC, IT incl. CBDT/CBIC extensions'],['GST rates & HSN','2026.10','Rates, RCM services, e-invoice thresholds'],['TDS/TCS section map','1.3','IT Act 1961 ↔ IT Act 2025 cross-walk, rates, thresholds'],['Bank statement parsers','2026.11','42 banks, 118 statement layouts'],['Schedule III & CARO','2025.1','Division I/II heads, ratio definitions, 21 CARO clauses'],['Grandfathering FMV','2018.01','Listed equity & equity MF prices at 31-01-2018'],['Notice reply templates','2026.09','37 templates across IT, GST, TDS']].map(r=>`<tr><td class="b">${r[0]}</td><td class="mono">${r[1]}</td><td class="small muted">${r[2]}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Privacy & security</h3><div class="list">${[['Offline first','All client data stays in an encrypted SQLite database on this computer. Nothing is uploaded.'],['Encryption','AES-256 at rest; the password vault uses a separate master key'],['Roles','Partner, Manager, Article and Accountant have different rights; articles cannot see the password vault'],['Audit trail','Every posting, mapping change and sign-off is logged with user and time'],['Backup','Encrypted backup to a USB drive or the firm’s NAS on a schedule'],['DPDP Act 2023','Purpose-limited processing; client data is exported and erased on disengagement']].map(x=>`<div class="it"><span class="chip ok">✓</span><div><div class="b">${x[0]}</div><div class="small muted">${x[1]}</div></div></div>`).join('')}</div></div>
 <div class="card"><h3>How clients reach an offline app</h3><p class="small muted" style="line-height:1.6">The firm’s data stays on the firm’s computer. Clients can reach it three ways: (1) <b>WhatsApp / email intake</b>, where attachments land in a watched folder and are matched to the open request (fully offline); (2) an <b>optional end-to-end encrypted relay</b> that serves the client portal on web or mobile and only passes files through to the firm’s machine; (3) a <b>LAN or office kiosk</b> for walk-in clients.</p></div>
 <div class="card"><h3>About this prototype</h3><p class="small muted" style="line-height:1.6">This is a clickable prototype of the desktop app with sample data for one CA firm (Iyer & Associates) and its clients. Matching, sampling, GSTIN validation, depreciation, capital gains, regime comparison and red-flag rules all compute live. Tally posting, OCR and file parsing are simulated here; in the desktop build (Tauri + local SQLite) they run against your real Tally and files.</p></div></div>`;
